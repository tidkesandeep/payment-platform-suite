[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-platform"
version = "0.1.0"
description = "Local-first agentic payment authorization platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "kafka-python>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
payment-platform = "payment_platform.api.main:run"
payment-simulator = "simulator.cli:main"
payment-stream = "stream_processor.cli:main"
payment-features-rebuild = "feature_rebuild.cli:main"

[tool.setuptools.packages.find]
where = ["src", "apps"]

[tool.setuptools.package-data]
payment_platform = ["schema.sql", "schema_phase2.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "apps"]
testpaths = ["tests"]
asyncio_mode = "auto"
