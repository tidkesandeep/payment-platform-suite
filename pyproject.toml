[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-platform"
version = "0.1.0"
description = "Local-first agentic payment authorization platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "kafka-python>=2.0.2",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "verifiable-intent @ git+https://github.com/agent-intent/verifiable-intent.git@356c29635f1c44df7de02edb58699ca9f29bece6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "locust>=2.31.0",
]

[project.scripts]
payment-platform = "payment_platform.api.main:run"
payment-simulator = "simulator.cli:main"
payment-stream = "stream_processor.cli:main"
payment-features-rebuild = "feature_rebuild.cli:main"
payment-train-champion = "payment_platform.champion.train:main"
payment-demo-issuer = "demo.issuer:main"
payment-demo = "demo.cli:main"
payment-security-scan = "payment_platform.security.cli:main"
payment-load = "loadtest.cli:main"

[tool.setuptools.packages.find]
where = ["src", "apps"]

[tool.setuptools.package-data]
payment_platform = ["schema.sql", "schema_phase2.sql", "schema_phase7.sql", "schema_phase8.sql", "champion/champion.json", "champion/metrics.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "apps", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
